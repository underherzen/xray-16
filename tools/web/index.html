<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenXRay (wasm)</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; }
  #status { position: absolute; top: 8px; left: 8px; color: #9c9; font: 12px monospace; }
  canvas { width: 100%; height: 100%; display: block; }
  #fullscreen { position: absolute; top: 8px; right: 8px; z-index: 1; padding: 4px 10px;
                background: rgba(0,0,0,.5); color: #9c9; border: 1px solid #9c9;
                font: 12px monospace; cursor: pointer; }
  :fullscreen #fullscreen { display: none; }
  #sendsaves { position: absolute; top: 8px; right: 100px; z-index: 1; padding: 4px 10px;
               background: rgba(0,0,0,.5); color: #9c9; border: 1px solid #9c9;
               font: 12px monospace; cursor: pointer; }
  :fullscreen #sendsaves { display: none; }
  #audiogate { position: absolute; inset: 0; z-index: 2; display: flex;
               align-items: center; justify-content: center; cursor: pointer;
               background: rgba(0,0,0,.55); color: #cfc; font: 20px sans-serif; }
  #audiogate[hidden] { display: none; }
  #loader { position: absolute; left: 50%; bottom: 2%; transform: translateX(-50%); z-index: 2;
            width: min(560px, calc(100% - 32px)); padding: 14px 16px; box-sizing: border-box;
            background: rgba(0,0,0,.72); border: 1px solid #586; color: #cfc;
            font: 14px sans-serif; pointer-events: none; }
  #loader[hidden] { display: none; }
  #loader .bar { height: 8px; margin: 10px 0 6px; background: #232; overflow: hidden; }
  #loader .fill { height: 100%; width: 0; background: #8c8; transition: width .2s; }
  #loader .small { font-size: 12px; color: #9b9; }
  #crash { position: absolute; inset: 0; z-index: 3; overflow: auto; padding: 24px;
           background: rgba(40,0,0,.92); color: #fcc; font: 13px monospace; white-space: pre-wrap; }
  #crash[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status">loading…</div>
<button id="fullscreen" title="Fullscreen + mouse capture">fullscreen</button>
<button id="sendsaves" title="Upload saves and user.ltx to the local dev server">отправить сейвы</button>
<div id="crash" hidden></div>
<div id="loader" hidden><div id="loader-title"></div><div class="bar"><div class="fill" id="loader-fill"></div></div><div class="small" id="loader-text"></div></div>
<div id="audiogate" hidden>Нажмите, чтобы продолжить (включить звук)</div>
<script>
  var statusElement = document.getElementById('status');
  var params = new URLSearchParams(location.search);
  var Module = {
    preRun: [],
    postRun: [],
    canvas: document.getElementById('canvas'),
    // -no_cdb_cache: the engine would write each level's collision trees
    // (~140Mb for Zaton) to app data, which persists to IndexedDB and gets
    // loaded back into memory on every start; rebuilding costs ~3s instead.
    arguments: ['-nosplash', '-no_cdb_cache'],
    print: function (t) { logTail(t); console.log(t); },
    printErr: function (t) { logTail(t); console.error(t); },
    setStatus: function (t) { statusElement.textContent = t; },
    onAbort: function (t) { statusElement.textContent = 'aborted: ' + t; showCrash('aborted: ' + t); },
  };

  // A dead engine just leaves the last frame on screen, which reads as a
  // freeze: say so, with the end of the log for the bug report.
  var logLines = [];
  function logTail(t) {
    logLines.push(String(t));
    if (logLines.length > 40) logLines.shift();
  }
  function showCrash(what) {
    var crash = document.getElementById('crash');
    if (!crash.hidden) return;
    if (document.exitPointerLock) document.exitPointerLock();
    crash.textContent = 'Игра остановилась с ошибкой (перезагрузите страницу):\n' + what +
      '\n\nПоследние строки лога:\n' + logLines.join('\n');
    crash.hidden = false;
  }
  document.getElementById('crash').addEventListener('click', function () { this.hidden = true; });
  window.addEventListener('error', function (e) {
    showCrash((e.error && e.error.stack) || e.message);
  });

  // Dev: send the browser's saves and settings to the local dev server
  // (serve.py writes them to _uploads/) to reproduce a report.
  document.getElementById('sendsaves').addEventListener('click', function () {
    var button = this;
    if (!Module.XRFS || !Module.XRFS.overlay) { button.textContent = 'ещё не загружено'; return; }
    var files = [];
    Module.XRFS.overlay.forEach(function (entry, path) {
      if (entry.type === 'file' && entry.data &&
          (path.indexOf('_appdata_/savedgames/') === 0 || path === '_appdata_/user.ltx'))
        files.push([path, entry.data]);
    });
    button.textContent = 'отправка ' + files.length + '…';
    Promise.all(files.map(function (f) {
      return fetch('upload?path=' + f[0], { method: 'POST', body: f[1] }).then(function (r) {
        if (!r.ok) throw new Error(f[0] + ': ' + r.status);
      });
    })).then(function () { button.textContent = 'отправлено: ' + files.length; },
             function (e) { button.textContent = 'ошибка: ' + e.message; });
  });

  // Fullscreen needs a user gesture, so it hangs off a button. The whole
  // page goes fullscreen (not just the canvas) so the status overlay stays
  // usable; pointer lock is requested in the same gesture for mouse look.
  document.getElementById('fullscreen').addEventListener('click', function () {
    var canvas = document.getElementById('canvas');
    document.documentElement.requestFullscreen().then(function () {
      canvas.requestPointerLock();
    }).catch(function (e) { console.error('fullscreen: ' + e); });
  });

  // Engine command line: ?args=a%20b%20c (space-separated tokens) and
  // ?newgame=1 sugar for the same autostart string used natively in M0.5.
  var extraArgs = params.get('args') || '';
  if (extraArgs)
    Module.arguments = Module.arguments.concat(extraArgs.split(' '));
  if (params.get('newgame'))
    Module.arguments = Module.arguments.concat(['-start', 'server(all/single/alife/new)']);

  // Dev probe: ?shot=SECONDS[,SECONDS...] -- after N seconds of wall-clock
  // time, dump a screenshot of the canvas into the console as a data URL
  // (one rAF after the engine frame of the same tick, so the drawing buffer
  // is still valid). Headless Chrome writes console to stderr, the runner
  // script extracts the base64 payload.
  var shotParam = params.get('shot');
  if (shotParam) {
    shotParam.split(',').forEach(function (tok) {
      var shotDelay = +tok;
      if (!(shotDelay > 0)) return;
      setTimeout(function () {
        requestAnimationFrame(function () {
          try {
            console.log('CANVAS_SHOT[at_' + shotDelay + 's]:data:image/png;base64,' +
                document.getElementById('canvas').toDataURL('image/png').split(',', 2)[1]);
          } catch (e) {
            console.log('CANVAS_SHOT_ERR:' + e);
          }
        });
      }, shotDelay * 1000);
    });
  }

  // Dev probe: ?mem=SECONDS -- log the wasm heap size every N seconds so
  // long runs can be checked against the 2.5 GB budget.
  var memEvery = +params.get('mem') || 0;
  if (memEvery > 0) {
    // the engine's profiling slots and hitch log are off without it;
    // &prof=0 keeps them off to measure frame times without their overhead
    if (params.get('prof') !== '0')
      Module.arguments = Module.arguments.concat(['-web_prof']);
    // The engine frame runs inside rAF, so the rAF rate is the game FPS.
    var frames = 0, worst = 0, last = performance.now();
    (function tick(now) {
      frames++;
      worst = Math.max(worst, now - last);
      last = now;
      requestAnimationFrame(tick);
    })(last);
    // rAF gaps also include GPU-side stalls (shader links, uploads); a late
    // 100ms timer measures how long the main thread itself was blocked.
    var block = 0, tickAt = performance.now();
    setInterval(function () {
      var now = performance.now();
      block = Math.max(block, now - tickAt - 100);
      tickAt = now;
    }, 100);
    setInterval(function () {
      var cpu = '';
      try { // engine CPU per frame vs the rAF interval (throws before the runtime is up)
        var fs = function (w) { return Module.ccall('xr_web_frame_stats', 'number', ['number'], [w]); };
        cpu = ' engine_cpu_avg=' + fs(0).toFixed(1) + 'ms max=' + Math.round(fs(1)) + 'ms n=' + fs(2);
        var prof = Module.ccall('xr_web_prof_report', 'string', [], []);
        if (prof) console.log('PROF: ' + prof);
      } catch (e) {}
      console.log('FPS: avg=' + (frames / memEvery).toFixed(1) + ' worst_frame=' + Math.round(worst) +
        'ms main_blocked=' + Math.round(block) + 'ms' + cpu);
      frames = 0; worst = 0; block = 0;
      // HEAPU8 is internal to the emscripten glue; XRFS (pre-js, same
      // scope) exposes a snapshot instead.
      if (!Module.XRFS) return;
      var m = Module.XRFS.memStats(), MB = function (b) { return Math.round(b / 1048576); }; // heap can pass 2Gb: no int32 shifts
      console.log('MEM: heap=' + MB(m.heap) + 'MB malloc_in_use=' + MB(m.mallocInUse) +
        'MB malloc_arena=' + MB(m.mallocArena) + 'MB xrfs_pack=' + MB(m.pack) +
        'MB xrfs_small=' + MB(m.small) + 'MB xrfs_blocks=' + MB(m.blocks) + 'MB audio=' + m.audio);
      console.log('IO: requests=' + m.io.requests + ' MB=' + MB(m.io.bytes) +
        ' xhr_s=' + (m.io.xhrMs / 1000).toFixed(1) + ' convert_s=' + (m.io.convertMs / 1000).toFixed(1));
    }, memEvery * 1000);
  }

  // Dev probe: ?lua=NAME.script[,NAME2.script] -- inject dev scripts served
  // next to index.html into gamedata/scripts (see tools/web/web_smoke.script).
  var luaFiles = params.get('lua');
  if (luaFiles) {
    window.XRFS_CONFIG = window.XRFS_CONFIG || {};
    XRFS_CONFIG.injectFiles = XRFS_CONFIG.injectFiles || {};
    luaFiles.split(',').forEach(function (f) {
      XRFS_CONFIG.injectFiles['gamedata/scripts/' + f] = f;
    });
  }

  // Dev probe: ?cmd=SEC:command|SEC:command -- engine console commands at
  // the given times ("|" separates, so Lua in run_string may use ";").
  var cmdSeq = params.get('cmd');
  if (cmdSeq) {
    cmdSeq.split('|').forEach(function (step) {
      var m = step.match(/^([\d.]+):(.*)$/);
      if (!m) return;
      setTimeout(function () {
        console.log('CMD_PROBE ' + m[2]);
        Module.ccall('xr_web_console_execute', null, ['string'], [m[2]]);
      }, +m[1] * 1000);
    });
  }

  // Dev probe: ?sabtimeout=MS -- shorten the fetch worker timeout (tests the
  // sync XHR fallback XRFS takes when a worker fetch stalls).
  if (params.get('sab') === '0') { // sync XHR only
    window.XRFS_CONFIG = window.XRFS_CONFIG || {};
    XRFS_CONFIG.noSab = true;
  }
  if (params.get('sabtimeout')) {
    window.XRFS_CONFIG = window.XRFS_CONFIG || {};
    XRFS_CONFIG.sabTimeoutMs = +params.get('sabtimeout');
  }

  // Dev probe: ?fsprof=SEC -- time the XRFS / FS ops, report at SEC.
  var fsProfAt = +params.get('fsprof') || 0;
  if (fsProfAt > 0) {
    window.XRFS_CONFIG = window.XRFS_CONFIG || {};
    XRFS_CONFIG.profile = true;
    setTimeout(function () {
      Module.XRFS.profTop().forEach(function (r) {
        console.log('FSPROF ' + r[0] + ' n=' + r[1] + ' ms=' + Math.round(r[2]));
      });
    }, fsProfAt * 1000);
  }

  // Dev probe: ?glprof=MS -- time every WebGL call; log single calls slower
  // than MS and, per second, the calls that added up to the most time. A GL
  // call blocks the main thread when ANGLE has to finish work in the GPU
  // process first (shader compiles at first draw, texture uploads...).
  var glProfMs = +params.get('glprof') || 0;
  if (glProfMs > 0) {
    var glTotals = {};
    var proto = WebGL2RenderingContext.prototype;
    Object.getOwnPropertyNames(proto).forEach(function (name) {
      var d = Object.getOwnPropertyDescriptor(proto, name);
      if (!d || typeof d.value !== 'function' || name === 'constructor')
        return;
      var fn = d.value;
      proto[name] = function () {
        var t0 = performance.now();
        var r = fn.apply(this, arguments);
        var dt = performance.now() - t0;
        var e = glTotals[name] || (glTotals[name] = [0, 0]);
        e[0] += dt; e[1]++;
        if (dt >= glProfMs)
          console.log('GLSLOW ' + name + ' ' + dt.toFixed(1) + ' ms');
        return r;
      };
    });
    setInterval(function () {
      var top = Object.keys(glTotals).map(function (k) { return [k, glTotals[k][0], glTotals[k][1]]; })
        .filter(function (r) { return r[1] >= 5; })
        .sort(function (a, b) { return b[1] - a[1]; }).slice(0, 6);
      if (top.length)
        console.log('GLPROF ' + top.map(function (r) { return r[0] + ' ' + Math.round(r[1]) + 'ms/' + r[2]; }).join(' '));
      glTotals = {};
    }, 1000);
  }

  // Dev probe: ?iotop=SEC -- the files XRFS fetched most bytes of, by then.
  var ioTopAt = +params.get('iotop') || 0;
  if (ioTopAt > 0) {
    setTimeout(function () {
      Module.XRFS.ioTop(25).forEach(function (r) {
        console.log('IOTOP ' + (r[2] / 1048576).toFixed(1) + 'MB x' + r[1] + ' ' + decodeURIComponent(r[0]));
      });
    }, ioTopAt * 1000);
  }

  // Dev probe: ?mouse=move@30:640,360;click@35:640,360 ...
  // Synthetic events on the canvas (coordinates in canvas pixels, mapped
  // through the CSS rect) -- lets headless runs exercise SDL mouse input.
  var mouseSeq = params.get('mouse');
  if (mouseSeq) {
    mouseSeq.split(';').forEach(function (step) {
      var m = step.match(/(move|down|up|click)@([\d.]+):(\d+),(\d+)/);
      if (!m) return;
      var action = m[1], at = +m[2] * 1000, cx = +m[3], cy = +m[4];
      setTimeout(function () {
        var canvas = document.getElementById('canvas');
        var r = canvas.getBoundingClientRect();
        var evInit = {
          clientX: r.left + cx / canvas.width * r.width,
          clientY: r.top + cy / canvas.height * r.height,
          button: 0, buttons: 1, bubbles: true, cancelable: true,
        };
        console.log('MOUSE_PROBE ' + action + ' ' + cx + ',' + cy);
        canvas.dispatchEvent(new MouseEvent('mousemove', evInit));
        if (action !== 'move') {
          canvas.dispatchEvent(new MouseEvent('mousedown', evInit));
          if (action === 'click' || action === 'up')
            canvas.dispatchEvent(new MouseEvent('mouseup', evInit));
        }
      }, at);
    });
  }

  // Dev probe: ?keys=down@300:w;up@540:w -- synthetic keyboard events on
  // the canvas; they bubble up to document where the SDL glue listens.
  var keySeq = params.get('keys');
  if (keySeq) {
    var KEYCODES = { w: 87, a: 65, s: 83, d: 68, q: 81, e: 69, r: 82, f: 70,
        shift: 16, ctrl: 17, alt: 18, space: 32, escape: 27, enter: 13, tab: 9 };
    for (var fk = 1; fk <= 12; fk++) KEYCODES['f' + fk] = 111 + fk; // F6 quicksave, F9 quickload
    keySeq.split(';').forEach(function (step) {
      var m = step.match(/(down|up)@([\d.]+):([\w]+)/);
      if (!m) return;
      var action = m[1], at = +m[2] * 1000, keyName = m[3];
      setTimeout(function () {
        var lower = keyName.toLowerCase();
        var init = {
          key: /^f\d+$/.test(lower) ? lower.toUpperCase() : lower,
          code: keyName.length === 1 ? 'Key' + keyName.toUpperCase() :
              ({ shift: 'ShiftLeft', ctrl: 'ControlLeft', alt: 'AltLeft',
                 space: 'Space', escape: 'Escape', enter: 'Enter', tab: 'Tab' })[lower] ||
              (/^f\d+$/.test(lower) ? lower.toUpperCase() : keyName),
          keyCode: KEYCODES[lower] || 0, which: KEYCODES[lower] || 0,
          bubbles: true, cancelable: true,
        };
        console.log('KEY_PROBE ' + action + ' ' + keyName);
        document.getElementById('canvas').dispatchEvent(new KeyboardEvent('key' + action, init));
      }, at);
    });
  }
</script>
<script>
  // Browsers keep audio suspended until a user gesture. The engine's intro
  // videos are timed by their sound, so until then the screen just stays
  // black. Ask for the gesture while the AudioContext is suspended; the click
  // itself resumes it (Emscripten's OpenAL listens for mousedown/keydown).
  (function () {
    var gate = document.getElementById('audiogate');
    gate.addEventListener('mousedown', function () { gate.hidden = true; });
    setInterval(function () {
      var x = Module.XRFS;
      if (!x || !x.audioStats) return;
      gate.hidden = x.audioStats().indexOf('suspended') !== 0;
    }, 500);
  })();
</script>
<script>
  // Loading progress. Startup: the engine binary, the file index and the
  // startup pack (~180Mb together) are fetched here, before the engine runs,
  // with real byte counts; the engine then takes them from memory
  // (Module.wasmBinary, XRFS_CONFIG.indexText/packData). Level loads: the
  // loading screen's stage progress plus what XRFS actually downloaded, and
  // an estimate of what is left from the previous level load.
  (function () {
    var loader = document.getElementById('loader');
    var title = document.getElementById('loader-title');
    var fill = document.getElementById('loader-fill');
    var text = document.getElementById('loader-text');
    var MB = function (b) { return (b / 1048576).toFixed(b < 10485760 ? 1 : 0); };
    var logged = -Infinity;
    function show(t, share, detail) {
      if (params.get('mem') && performance.now() - logged > 2000) { // probes: the overlay is not on the canvas shots
        logged = performance.now();
        console.log('LOADER ' + t + ' | ' + Math.round(share * 100) + '% | ' + (detail || ''));
      }
      loader.hidden = false;
      title.textContent = t;
      fill.style.width = Math.max(0, Math.min(100, share * 100)).toFixed(1) + '%';
      text.textContent = detail || '';
    }
    function eta(seconds) {
      if (!isFinite(seconds) || seconds <= 0) return '';
      return seconds < 60 ? Math.ceil(seconds) + ' с' : Math.floor(seconds / 60) + ' мин ' + Math.ceil(seconds % 60) + ' с';
    }

    var parts = [{ url: 'xr_3da.wasm' }, { url: 'files.json' }, { url: 'pack.bin' }];
    var started = performance.now();
    function progress() {
      var got = 0, total = 0, known = true;
      parts.forEach(function (p) { got += p.got || 0; if (p.total) total += p.total; else known = false; });
      var speed = got / Math.max(0.001, (performance.now() - started) / 1000);
      var left = known ? (total - got) / speed : NaN;
      show('Загрузка игры', known && total ? got / total : 0,
        MB(got) + (known ? ' / ' + MB(total) : '') + ' МБ · ' + MB(speed) + ' МБ/с' +
        (eta(left) ? ' · осталось ' + eta(left) : ''));
    }
    function download(part) {
      return fetch(part.url).then(function (r) {
        if (!r.ok) throw new Error(part.url + ': HTTP ' + r.status);
        part.total = +r.headers.get('Content-Length') || 0;
        var reader = r.body.getReader(), chunks = [];
        part.got = 0;
        return (function pump() {
          return reader.read().then(function (step) {
            if (step.done) return;
            chunks.push(step.value);
            part.got += step.value.length;
            return pump();
          });
        })().then(function () {
          var out = new Uint8Array(part.got), at = 0;
          chunks.forEach(function (c) { out.set(c, at); at += c.length; });
          part.data = out;
        });
      });
    }
    var timer = setInterval(progress, 200);
    progress();
    Promise.all(parts.map(download)).then(function () {
      clearInterval(timer);
      Module.wasmBinary = parts[0].data.buffer;
      window.XRFS_CONFIG = window.XRFS_CONFIG || {};
      XRFS_CONFIG.indexText = new TextDecoder().decode(parts[1].data);
      XRFS_CONFIG.packData = parts[2].data;
      parts.forEach(function (p) { p.data = null; });
      show('Запуск движка…', 1, '');
      var prevInit = Module.onRuntimeInitialized;
      Module.onRuntimeInitialized = function () {
        if (prevInit) prevInit();
        // main() runs right after and blocks until the engine is up; a timer
        // fires once it has handed over to the browser's frame loop.
        setTimeout(function () { loader.hidden = true; watchLevelLoads(); }, 0);
      };
      var script = document.createElement('script');
      script.src = 'xr_3da.js';
      document.body.appendChild(script);
    }, function (e) {
      clearInterval(timer);
      show('Не удалось загрузить игру', 0, e.message + ' — перезагрузите страницу');
    });

    // The loading screen being up is the load (the engine reports "ready" in
    // the middle of a new game's load, which then reads most of its data);
    // it is over once the level is ready and nothing has arrived for a while
    // -- then the screen waits for a key.
    function watchLevelLoads() {
      var KEY = 'xr_level_load_bytes';
      var load = null;
      setInterval(function () {
        var state = 0;
        try { state = Module.ccall('xr_web_loading_state', 'number', [], []); } catch (e) {}
        var io = Module.XRFS && Module.XRFS.io;
        if (state === 0 || !io) {
          if (load && !load.done && load.bytes > 0) {
            try { localStorage.setItem(KEY, String(load.bytes)); } catch (e) {}
          }
          load = null;
          loader.hidden = true;
          return;
        }
        var now = performance.now();
        if (!load) {
          var last = 0;
          try { last = +localStorage.getItem(KEY) || 0; } catch (e) {}
          load = { startBytes: io.bytes, startTime: now, expected: last, bytes: 0, changed: now, done: false };
        }
        var bytes = io.bytes - load.startBytes;
        if (bytes !== load.bytes) { load.bytes = bytes; load.changed = now; }
        load.done = state === 2 && now - load.changed > 3000; // data arriving again undoes it
        if (load.done) {
          try { localStorage.setItem(KEY, String(load.bytes)); } catch (e) {}
          show('Загрузка уровня завершена', 1, MB(load.bytes) + ' МБ — нажмите любую клавишу');
          return;
        }
        var seconds = Math.max(0.001, (now - load.startTime) / 1000);
        var speed = load.bytes / seconds;
        var detail = MB(load.bytes), share;
        if (load.expected > 0) {
          // the previous level load as the yardstick: real bytes, estimated total
          var total = Math.max(load.expected, load.bytes);
          share = Math.min(0.99, load.bytes / total);
          detail += ' / ≈' + MB(total) + ' МБ · ' + MB(speed) + ' МБ/с';
          var left = (total - load.bytes) / speed;
          if (load.bytes < total && eta(left)) detail += ' · осталось ~' + eta(left);
        } else {
          share = 1 - Math.exp(-seconds / 30); // first load: no total known yet
          detail += ' МБ · ' + MB(speed) + ' МБ/с';
        }
        show('Загрузка уровня', share, detail);
      }, 250);
    }
  })();
</script>
</body>
</html>
