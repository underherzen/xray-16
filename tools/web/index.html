<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenXRay (wasm)</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; }
  #status { position: absolute; top: 8px; left: 8px; color: #9c9; font: 12px monospace; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status">loading…</div>
<script>
  var statusElement = document.getElementById('status');
  var params = new URLSearchParams(location.search);
  var Module = {
    preRun: [],
    postRun: [],
    canvas: document.getElementById('canvas'),
    arguments: ['-nosplash'],
    print: function (t) { console.log(t); },
    printErr: function (t) { console.error(t); },
    setStatus: function (t) { statusElement.textContent = t; },
    onAbort: function (t) { statusElement.textContent = 'aborted: ' + t; },
  };

  // Engine command line: ?args=a%20b%20c (space-separated tokens) and
  // ?newgame=1 sugar for the same autostart string used natively in M0.5.
  var extraArgs = params.get('args') || '';
  if (extraArgs)
    Module.arguments = Module.arguments.concat(extraArgs.split(' '));
  if (params.get('newgame'))
    Module.arguments = Module.arguments.concat(['-start', 'server(all/single/alife/new)']);

  // Dev probe: ?shot=SECONDS[,SECONDS...] -- after N seconds of wall-clock
  // time, dump a screenshot of the canvas into the console as a data URL
  // (one rAF after the engine frame of the same tick, so the drawing buffer
  // is still valid). Headless Chrome writes console to stderr, the runner
  // script extracts the base64 payload.
  var shotParam = params.get('shot');
  if (shotParam) {
    shotParam.split(',').forEach(function (tok) {
      var shotDelay = +tok;
      if (!(shotDelay > 0)) return;
      setTimeout(function () {
        requestAnimationFrame(function () {
          try {
            console.log('CANVAS_SHOT[at_' + shotDelay + 's]:data:image/png;base64,' +
                document.getElementById('canvas').toDataURL('image/png').split(',', 2)[1]);
          } catch (e) {
            console.log('CANVAS_SHOT_ERR:' + e);
          }
        });
      }, shotDelay * 1000);
    });
  }

  // Dev probe: ?mem=SECONDS -- log the wasm heap size every N seconds so
  // long runs can be checked against the 2.5 GB budget.
  var memEvery = +params.get('mem') || 0;
  if (memEvery > 0) {
    // The engine frame runs inside rAF, so the rAF rate is the game FPS.
    var frames = 0, worst = 0, last = performance.now();
    (function tick(now) {
      frames++;
      worst = Math.max(worst, now - last);
      last = now;
      requestAnimationFrame(tick);
    })(last);
    setInterval(function () {
      console.log('FPS: avg=' + (frames / memEvery).toFixed(1) + ' worst_frame=' + Math.round(worst) + 'ms');
      frames = 0; worst = 0;
      // HEAPU8 is internal to the emscripten glue; XRFS (pre-js, same
      // scope) exposes a snapshot instead.
      if (!Module.XRFS) return;
      var m = Module.XRFS.memStats(), MB = function (b) { return Math.round(b / 1048576); }; // heap can pass 2Gb: no int32 shifts
      console.log('MEM: heap=' + MB(m.heap) + 'MB xrfs_pack=' + MB(m.pack) +
        'MB xrfs_small=' + MB(m.small) + 'MB xrfs_blocks=' + MB(m.blocks) + 'MB');
    }, memEvery * 1000);
  }

  // Dev probe: ?mouse=move@30:640,360;click@35:640,360 ...
  // Synthetic events on the canvas (coordinates in canvas pixels, mapped
  // through the CSS rect) -- lets headless runs exercise SDL mouse input.
  var mouseSeq = params.get('mouse');
  if (mouseSeq) {
    mouseSeq.split(';').forEach(function (step) {
      var m = step.match(/(move|down|up|click)@([\d.]+):(\d+),(\d+)/);
      if (!m) return;
      var action = m[1], at = +m[2] * 1000, cx = +m[3], cy = +m[4];
      setTimeout(function () {
        var canvas = document.getElementById('canvas');
        var r = canvas.getBoundingClientRect();
        var evInit = {
          clientX: r.left + cx / canvas.width * r.width,
          clientY: r.top + cy / canvas.height * r.height,
          button: 0, buttons: 1, bubbles: true, cancelable: true,
        };
        console.log('MOUSE_PROBE ' + action + ' ' + cx + ',' + cy);
        canvas.dispatchEvent(new MouseEvent('mousemove', evInit));
        if (action !== 'move') {
          canvas.dispatchEvent(new MouseEvent('mousedown', evInit));
          if (action === 'click' || action === 'up')
            canvas.dispatchEvent(new MouseEvent('mouseup', evInit));
        }
      }, at);
    });
  }

  // Dev probe: ?keys=down@300:w;up@540:w -- synthetic keyboard events on
  // the canvas; they bubble up to document where the SDL glue listens.
  var keySeq = params.get('keys');
  if (keySeq) {
    var KEYCODES = { w: 87, a: 65, s: 83, d: 68, q: 81, e: 69, r: 82, f: 70,
        shift: 16, ctrl: 17, alt: 18, space: 32, escape: 27, enter: 13, tab: 9 };
    keySeq.split(';').forEach(function (step) {
      var m = step.match(/(down|up)@([\d.]+):([\w]+)/);
      if (!m) return;
      var action = m[1], at = +m[2] * 1000, keyName = m[3];
      setTimeout(function () {
        var lower = keyName.toLowerCase();
        var init = {
          key: keyName.length === 1 ? lower : lower,
          code: keyName.length === 1 ? 'Key' + keyName.toUpperCase() :
              ({ shift: 'ShiftLeft', ctrl: 'ControlLeft', alt: 'AltLeft',
                 space: 'Space', escape: 'Escape', enter: 'Enter', tab: 'Tab' })[lower] || keyName,
          keyCode: KEYCODES[lower] || 0, which: KEYCODES[lower] || 0,
          bubbles: true, cancelable: true,
        };
        console.log('KEY_PROBE ' + action + ' ' + keyName);
        document.getElementById('canvas').dispatchEvent(new KeyboardEvent('key' + action, init));
      }, at);
    });
  }
</script>
<script src="xr_3da.js"></script>
</body>
</html>
